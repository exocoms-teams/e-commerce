<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Formula Matrix | LUMIÈRE Cosmetics</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Premium High-Fidelity Product Split Screen Components */
    .product-detail-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 6rem;
      margin-top: 2rem;
    }
    .gallery-viewframe {
      background-color: var(--white);
      border: 1px solid var(--border-color);
      height: 560px;
    }
    .gallery-viewframe img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .details-infopanel { padding: 1rem 0; }
    .breadcrumbs-wrap {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }
    .breadcrumbs-wrap a { color: var(--text-muted); }
    .breadcrumbs-wrap span { color: var(--text-color); font-weight: 500; }
    
    .product-title-header {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4.4rem;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }
    .rating-summary-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 1.4rem;
      color: var(--text-color);
      margin-bottom: 3rem;
    }
    .rating-summary-row .stars { margin-bottom: 0; }
    
    .financial-price-tag {
      font-size: 2.8rem;
      font-weight: 500;
      margin-bottom: 3.5rem;
    }
    .narrative-description {
      font-size: 1.6rem;
      color: var(--text-muted);
      margin-bottom: 4rem;
    }

    .shade-selector-widget { margin-bottom: 3.5rem; }
    .shade-selector-widget h5 {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
    }
    .shades-flex-grid { display: flex; gap: 1.5rem; align-items: center; }
    .shade-circle-btn {
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
      position: relative;
      transition: var(--transition);
    }
    .shade-circle-btn.active {
      transform: scale(1.15);
      border: 2px solid var(--text-color);
    }
    .shade-label-callout {
      font-size: 1.3rem;
      color: var(--text-muted);
      margin-left: 1rem;
      letter-spacing: 0.05em;
    }

    .purchase-action-dock {
      display: flex;
      gap: 2rem;
      margin-bottom: 5rem;
    }
    .quantitative-spinner {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      background-color: var(--white);
    }
    .quantitative-spinner button {
      width: 5rem;
      height: 5.4rem;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--text-color);
      transition: var(--transition);
    }
    .quantitative-spinner button:hover { color: var(--main-color); }
    .quantitative-spinner span {
      width: 4rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 500;
    }

    /* Tab Layout Module */
    .product-tabs-container {
      border-top: 1px solid var(--border-color);
      padding-top: 4rem;
    }
    .tab-headers-row {
      display: flex;
      gap: 4rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .tab-header {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }
    .tab-header.active { color: var(--text-color); }
    .tab-header.active::after {
      content: '';
      position: absolute;
      bottom: -1.7rem;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--text-color);
    }
    .tab-panel-content {
      font-size: 1.5rem;
      color: var(--text-muted);
      line-height: 1.8;
      display: none;
    }
    .tab-panel-content.active { display: block; }

    @media(max-width: 991px) {
      .product-detail-layout { grid-template-columns: 1fr; }
      .gallery-viewframe { height: 400px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">LUMIÈRE<span>.</span></a>
    <i class="fa-solid fa-bars" id="menu-icon"></i>
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="cart-btn" id="cart-btn">
        <i class="fa-regular fa-bag-shopping"></i>
        <span class="cart-count">0</span>
      </button>
      <a href="shop.html" class="btn-primary">Explore Collection</a>
    </div>
  </header>

  <section class="detail-section">
    <div class="product-detail-layout" id="dynamic-product-canvas">
      </div>
  </section>

  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Your Bag</h3>
      <button class="cart-close" id="cart-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="cart-body">
      <div class="cart-empty" id="sidebar-cart-empty">
        <i class="fa-regular fa-bag-shopping"></i>
        <p>Your luxury bag is empty.</p>
      </div>
      <div class="cart-items-list" id="sidebar-cart-list"></div>
    </div>
    <div class="cart-footer" id="sidebar-cart-footer">
      <div class="cart-total-row">
        <h4>Subtotal</h4>
        <span id="sidebar-cart-total">$0.00</span>
      </div>
      <div class="cart-footer-btns">
        <button class="btn-primary" style="width:100%" onclick="window.location.href='cart.html'">View Detailed Bag</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    // Component Handler Parsing Parameters for Dynamic Detail Page Routing
    document.addEventListener("DOMContentLoaded", () => {
      const routingParameters = new URLSearchParams(window.location.search);
      const specifiedId = parseInt(routingParameters.get("id") || "1");

      const linkedProduct = products.find(p => p.id === specifiedId) || products[0];
      let itemCountQuantity = 1;
      let activelySelectedShade = linkedProduct.shades.length > 0 ? linkedProduct.shades[0].name : null;

      const dynamicCanvas = document.getElementById("dynamic-product-canvas");

      function renderTemplateEngineOutput() {
        const shadesMarkup = linkedProduct.shades.length > 0 ? `
          <div class="shade-selector-widget">
            <h5>Select Shade: <span id="shade-name-readout" style="color:var(--text-color); font-weight:600;">${activelySelectedShade}</span></h5>
            <div class="shades-flex-grid">
              ${linkedProduct.shades.map((s, idx) => `
                <button class="shade-circle-btn ${s.name === activelySelectedShade ? 'active' : ''}" 
                        style="background-color: ${s.color}" 
                        data-shade-name="${s.name}"></button>
              `).join("")}
            </div>
          </div>
        ` : "";

        dynamicCanvas.innerHTML = `
          <div class="gallery-viewframe">
            <img src="${linkedProduct.img}" alt="${linkedProduct.name}">
          </div>

          <div class="details-infopanel">
            <div class="breadcrumbs-wrap">
              <a href="index.html">Home</a> / <a href="shop.html">Catalog</a> / <span>${linkedProduct.name}</span>
            </div>
            
            <h1 class="product-title-header">${linkedProduct.name}</h1>
            
            <div class="rating-summary-row">
              <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
              <span>(${linkedProduct.reviews} verified reviews)</span>
            </div>

            <div class="financial-price-tag">$${linkedProduct.price.toFixed(2)}</div>
            
            <p class="narrative-description">${linkedProduct.description}</p>

            ${shadesMarkup}

            <div class="purchase-action-dock">
              <div class="quantitative-spinner">
                <button id="decrement-quantity-btn">−</button>
                <span id="quantity-numerical-display">${itemCountQuantity}</span>
                <button id="increment-quantity-btn">+</button>
              </div>
              <button class="btn-primary" id="execute-add-bag-action" style="flex-grow:1; padding: 1.8rem 0;">Add To Luxury Bag</button>
            </div>

            <div class="product-tabs-container">
              <div class="tab-headers-row">
                <span class="tab-header active" data-target="panel-ingredients">Key Ingredients</span>
                <span class="tab-header" data-target="panel-application">Application Profile</span>
              </div>
              <div class="tab-panel-content active" id="panel-ingredients">
                <p style="margin-bottom:1rem;"><strong>Formulated With:</strong> ${linkedProduct.keyIngredients}</p>
                <p>Free of structural parabens, heavy synthetic phthalates, sulfates, and industrial mineral oils. Cruelty-free certified compound architecture.</p>
              </div>
              <div class="tab-panel-content" id="panel-application">
                <p style="margin-bottom:1rem;"><strong>Dermatological Finish:</strong> ${linkedProduct.finish}</p>
                <p><strong>Optimized For:</strong> ${linkedProduct.bestFor}</p>
                <p>Apply cleanly morning or evening to thoroughly washed epidermal zones. Massage fluidly outwards using small orbital compressions.</p>
              </div>
            </div>
          </div>
        `;

        attachInteractiveDetailListeners();
      }

      function attachInteractiveDetailListeners() {
        // Increment Controls
        document.getElementById("increment-quantity-btn").addEventListener("click", () => {
          itemCountQuantity++;
          document.getElementById("quantity-numerical-display").textContent = itemCountQuantity;
        });

        document.getElementById("decrement-quantity-btn").addEventListener("click", () => {
          if (itemCountQuantity > 1) {
            itemCountQuantity--;
            document.getElementById("quantity-numerical-display").textContent = itemCountQuantity;
          }
        });

        // Shade Selection Button Matrix Toggles
        document.querySelectorAll(".shade-circle-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            activelySelectedShade = btn.getAttribute("data-shade-name");
            document.getElementById("shade-name-readout").textContent = activelySelectedShade;
            document.querySelectorAll(".shade-circle-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
          });
        });

        // Add to Cart Execution Dispatches
        document.getElementById("execute-add-bag-action").addEventListener("click", () => {
          addProductToCart(linkedProduct.id, itemCountQuantity, activelySelectedShade);
        });

        // Tab Content Switching Matrices
        document.querySelectorAll(".tab-header").forEach(header => {
          header.addEventListener("click", () => {
            document.querySelectorAll(".tab-header").forEach(h => h.classList.remove("active"));
            document.querySelectorAll(".tab-panel-content").forEach(p => p.classList.remove("active"));
            
            header.classList.add("active");
            const structuralId = header.getAttribute("data-target");
            document.getElementById(structuralId).classList.add("active");
          });
        });
      }

      renderTemplateEngineOutput();
    });
  </script>
</body>
</html>
