<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tracker Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #0d1117; color: #e6edf3; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 { color: #a78bfa; margin-bottom: 20px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; text-align: center; }
    .stat-card .number { font-size: 28px; font-weight: bold; color: #a78bfa; }
    .stat-card .label { color: #8b949e; font-size: 12px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .card h2 { margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #30363d; }
    th { color: #8b949e; font-weight: 600; }
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .chart-box { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
    .chart-box canvas { max-height: 300px; width: 100% !important; }
    .empty { text-align: center; color: #8b949e; padding: 40px; }
    .badge { background: #2d1b69; color: #a78bfa; padding: 2px 10px; border-radius: 99px; font-size: 11px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .topbar input, .topbar select { background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 8px 12px; border-radius: 6px; }
    .topbar input { width: 200px; }
    @media (max-width: 768px) { .stats { grid-template-columns: 1fr 1fr; } .charts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>📊 Tracker Dashboard</h1>
      <div>
        <input type="text" id="searchInput" placeholder="Search products...">
        <select id="categoryFilter"><option value="">All Categories</option></select>
        <button onclick="loadData()" style="background:#6c47ff;border:none;color:white;padding:8px 16px;border-radius:6px;cursor:pointer;">↻ Refresh</button>
      </div>
    </div>

    <div class="stats" id="statsRow">
      <div class="stat-card"><div class="number" id="totalProducts">-</div><div class="label">Products</div></div>
      <div class="stat-card"><div class="number" id="totalViews">-</div><div class="label">Views</div></div>
      <div class="stat-card"><div class="number" id="totalPurchases">-</div><div class="label">Purchases</div></div>
      <div class="stat-card"><div class="number" id="conversionRate">-</div><div class="label">Conversion Rate</div></div>
    </div>

    <div class="card">
      <h2>📈 Trending Products</h2>
      <div id="trendingTable"><div class="empty">Loading data...</div></div>
    </div>

    <div class="charts-grid">
      <div class="chart-box"><h3>Categories</h3><canvas id="categoryChart"></canvas></div>
      <div class="chart-box"><h3>Activity</h3><canvas id="activityChart"></canvas></div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';
    let charts = {};

    async function loadData() {
      try {
        const response = await fetch(`${API}/products?limit=100`);
        if (!response.ok) throw new Error('API error');
        const data = await response.json();
        renderDashboard(data);
      } catch (e) {
        document.getElementById('trendingTable').innerHTML = 
          `<div class="empty">❌ Backend not running. Start with: python app.py</div>`;
        console.error('Error loading data:', e);
      }
    }

    function renderDashboard(data) {
      const products = data.products || [];
      
      // Update stats
      document.getElementById('totalProducts').textContent = data.total_products || 0;
      document.getElementById('totalViews').textContent = data.total_views || 0;
      document.getElementById('totalPurchases').textContent = data.total_purchases || 0;
      document.getElementById('conversionRate').textContent = 
        data.total_views > 0 ? Math.round((data.total_purchases / data.total_views) * 100) + '%' : '0%';

      // Update categories filter
      const filter = document.getElementById('categoryFilter');
      const currentVal = filter.value;
      filter.innerHTML = '<option value="">All Categories</option>';
      Object.keys(data.categories || {}).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        filter.appendChild(opt);
      });
      filter.value = currentVal;

      // Render table
      const table = document.getElementById('trendingTable');
      if (!products.length) {
        table.innerHTML = '<div class="empty">No products tracked yet. Browse shopping sites!</div>';
        return;
      }

      table.innerHTML = `
        <table>
          <thead><tr>
            <th>#</th><th>Product</th><th>Category</th><th>Store</th><th>Price</th>
            <th>Views</th><th>Purchases</th><th>Score</th>
          </tr></thead>
          <tbody>
            ${products.slice(0, 20).map((p, i) => `
              <tr>
                <td>${i + 1}</td>
                <td><strong>${p.title}</strong><br><small style="color:#8b949e;">${p.domain}</small></td>
                <td><span class="badge">${p.category || 'General'}</span></td>
                <td>${p.domain}</td>
                <td>${p.latest_price ? '$' + parseFloat(p.latest_price).toFixed(2) : '-'}</td>
                <td>${p.view_count}</td>
                <td>${p.purchase_count || 0}</td>
                <td>${Math.round(p.trend_score || 0)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      // Render charts
      renderCharts(data);
    }

    function renderCharts(data) {
      const cats = data.categories || {};
      const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]);
      const labels = entries.map(e => e[0]);
      const values = entries.map(e => e[1]);

      // Category chart
      if (charts.category) charts.category.destroy();
      charts.category = new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: {
          labels: labels.slice(0, 10),
          datasets: [{ 
            data: values.slice(0, 10), 
            backgroundColor: ['#6c47ff','#a855f7','#06b6d4','#10b981','#f59e0b','#f87171','#34d399','#60a5fa','#e879f9','#fb923c'],
            borderColor: '#161b22',
            borderWidth: 2
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'right', labels: { color: '#e6edf3', font: { size: 11 } } } } }
      });

      // Activity chart - sample data
      if (charts.activity) charts.activity.destroy();
      const daily = data.daily || {};
      const days = Array.from({length: 14}, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (13 - i));
        return d.toISOString().split('T')[0];
      });
      const viewData = days.map(d => (daily[d] || {}).views || 0);
      
      charts.activity = new Chart(document.getElementById('activityChart'), {
        type: 'line',
        data: {
          labels: days.map(d => d.slice(5)),
          datasets: [{
            label: 'Views',
            data: viewData,
            borderColor: '#6c47ff',
            backgroundColor: 'rgba(108,71,255,0.1)',
            fill: true,
            tension: 0.4,
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#e6edf3' } } },
          scales: { 
            x: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
            y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' }, beginAtZero: true }
          }
        }
      });
    }

    // Search and filter
    document.getElementById('searchInput').addEventListener('input', loadData);
    document.getElementById('categoryFilter').addEventListener('change', loadData);

    // Load data on page load
    loadData();
  </script>
</body>
</html>
