<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker · Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- sidebar (matches website style) -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">◆</span>
        <span>Tracker</span>
        <span class="brand-version">v2</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active">📊 Dashboard</button>
        <button class="nav-btn">📈 Trends</button>
        <button class="nav-btn">⚙️ Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div class="stat-row"><span>Products</span><strong id="sideTotal">-</strong></div>
        <div class="stat-row"><span>Views</span><strong id="sideViews">-</strong></div>
        <div class="status"><span class="status-dot online"></span> Live</div>
      </div>
    </aside>

    <!-- main -->
    <main class="main">
      <!-- topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <h1>📊 Dashboard</h1>
        </div>
        <div class="topbar-right">
          <input type="text" class="search" id="searchInput" placeholder="Search products...">
          <select class="filter-select" id="categoryFilter"><option value="">All Categories</option></select>
          <button class="btn-outline" onclick="loadData()">↻ Refresh</button>
        </div>
      </header>

      <!-- page content -->
      <section class="page">
        <!-- KPI row -->
        <div class="kpi-row" id="statsRow">
          <div class="kpi-card"><div class="label">Products</div><div class="value" id="totalProducts">-</div></div>
          <div class="kpi-card"><div class="label">Views</div><div class="value" id="totalViews">-</div></div>
          <div class="kpi-card"><div class="label">Purchases</div><div class="value" id="totalPurchases">-</div></div>
          <div class="kpi-card"><div class="label">Conversion</div><div class="value" id="conversionRate">-</div><div class="sub">views → purchases</div></div>
        </div>

        <!-- table card -->
        <div class="card">
          <div class="card-header">
            <h2>📈 Trending Products</h2>
            <span class="badge-live">● live</span>
          </div>
          <div class="table-wrap" id="trendingTable">
            <div class="empty-row">Loading data…</div>
          </div>
        </div>

        <!-- charts -->
        <div class="charts-grid">
          <div class="chart-box"><h3>Categories</h3><canvas id="categoryChart"></canvas></div>
          <div class="chart-box"><h3>Activity (14d)</h3><canvas id="activityChart"></canvas></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // ----- theme (matches website theme.js) -----
    (function themeInit() {
      const STORAGE_KEY = 'tracker-theme';
      function getStoredTheme() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === 'light' || saved === 'dark') return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem(STORAGE_KEY, theme);
      }
      applyTheme(getStoredTheme());
      // also listen to system changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem(STORAGE_KEY)) {
          applyTheme(e.matches ? 'dark' : 'light');
        }
      });
    })();

    // ----- dashboard logic -----
    const API = 'http://localhost:5000/api';
    let charts = {};

    async function loadData() {
      try {
        const response = await fetch(`${API}/products?limit=100`);
        if (!response.ok) throw new Error('API error');
        const data = await response.json();
        renderDashboard(data);
      } catch (e) {
        document.getElementById('trendingTable').innerHTML =
          `<div class="empty-row">❌ Backend not running. Start with: python app.py</div>`;
        console.error('Error loading data:', e);
      }
    }

    function renderDashboard(data) {
      const products = data.products || [];

      // update KPI
      document.getElementById('totalProducts').textContent = data.total_products || 0;
      document.getElementById('totalViews').textContent = data.total_views || 0;
      document.getElementById('totalPurchases').textContent = data.total_purchases || 0;
      document.getElementById('conversionRate').textContent =
        data.total_views > 0 ? Math.round((data.total_purchases / data.total_views) * 100) + '%' : '0%';
      // sidebar
      document.getElementById('sideTotal').textContent = data.total_products || 0;
      document.getElementById('sideViews').textContent = data.total_views || 0;

      // category filter
      const filter = document.getElementById('categoryFilter');
      const currentVal = filter.value;
      filter.innerHTML = '<option value="">All Categories</option>';
      Object.keys(data.categories || {}).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        filter.appendChild(opt);
      });
      filter.value = currentVal;

      // table
      const table = document.getElementById('trendingTable');
      if (!products.length) {
        table.innerHTML = '<div class="empty-row">No products tracked yet. Browse shopping sites!</div>';
        return;
      }

      table.innerHTML = `
        <table class="data-table">
          <thead><tr>
            <th>#</th><th>Product</th><th>Category</th><th>Store</th><th>Price</th>
            <th>Views</th><th>Purchases</th><th>Score</th>
          </tr></thead>
          <tbody>
            ${products.slice(0, 20).map((p, i) => `
              <tr>
                <td>${i + 1}</td>
                <td><div class="product-cell"><span class="name">${p.title || 'Untitled'}</span><span class="domain">${p.domain || ''}</span></div></td>
                <td><span class="cat-pill">${p.category || 'General'}</span></td>
                <td>${p.domain || '-'}</td>
                <td>${p.latest_price ? '$' + parseFloat(p.latest_price).toFixed(2) : '-'}</td>
                <td>${p.view_count || 0}</td>
                <td>${p.purchase_count || 0}</td>
                <td><div class="score-bar-wrap"><div class="score-bar"><div class="fill" style="width:${Math.min(100, (p.trend_score || 0))}%"></div></div><span class="score-val">${Math.round(p.trend_score || 0)}</span></div></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      renderCharts(data);
    }

    function renderCharts(data) {
      const cats = data.categories || {};
      const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]);
      const labels = entries.map(e => e[0]);
      const values = entries.map(e => e[1]);

      // category chart
      if (charts.category) charts.category.destroy();
      charts.category = new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: {
          labels: labels.slice(0, 10),
          datasets: [{
            data: values.slice(0, 10),
            backgroundColor: ['#6c47ff','#a855f7','#06b6d4','#10b981','#f59e0b','#f87171','#34d399','#60a5fa','#e879f9','#fb923c'],
            borderColor: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#111',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#a3a3a3',
                font: { size: 11 }
              }
            }
          }
        }
      });

      // activity chart
      if (charts.activity) charts.activity.destroy();
      const daily = data.daily || {};
      const days = Array.from({length: 14}, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (13 - i));
        return d.toISOString().split('T')[0];
      });
      const viewData = days.map(d => (daily[d] || {}).views || 0);

      charts.activity = new Chart(document.getElementById('activityChart'), {
        type: 'line',
        data: {
          labels: days.map(d => d.slice(5)),
          datasets: [{
            label: 'Views',
            data: viewData,
            borderColor: getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#a78bfa',
            backgroundColor: 'rgba(108,71,255,0.1)',
            fill: true,
            tension: 0.4,
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: {
                color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#a3a3a3'
              }
            }
          },
          scales: {
            x: {
              ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#a3a3a3' },
              grid: { color: getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#2a2a2a' }
            },
            y: {
              ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#a3a3a3' },
              grid: { color: getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#2a2a2a' },
              beginAtZero: true
            }
          }
        }
      });
    }

    // search + filter
    document.getElementById('searchInput').addEventListener('input', loadData);
    document.getElementById('categoryFilter').addEventListener('change', loadData);

    // initial load
    loadData();

    // re-render charts on theme change (custom event from website theme)
    document.addEventListener('themechange', () => {
      if (charts.category || charts.activity) {
        // just reload data to refresh chart colors
        loadData();
      }
    });
  </script>
</body>
</html>
