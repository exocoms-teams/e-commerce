<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#2563EB"/>

  <!-- Abstract "P" / payment rail mark -->
  <!-- Vertical bar -->
  <rect x="9" y="7" width="4" height="18" rx="2" fill="white"/>

  <!-- Top horizontal cap -->
  <rect x="9" y="7" width="10" height="4" rx="2" fill="white"/>

  <!-- Mid horizontal cap (creates the P crossbar) -->
  <rect x="9" y="15" width="9" height="3.5" rx="1.75" fill="white"/>

  <!-- Subtle accent dot — bottom right, evokes a chip/NFC -->
  <circle cx="23" cy="23" r="3" fill="rgba(255,255,255,0.35)"/>
  <circle cx="23" cy="23" r="1.5" fill="white"/>
</svg>
