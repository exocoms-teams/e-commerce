  <!-- Mastercard : RETIRE VOLONTAIREMENT.
       Sa marque est constituee de deux disques (rouge #EB001B, jaune #F79E1B) avec
       une zone de recouvrement orange. Le trace monochrome disponible est un chemin
       unique, donc incapable de porter ces deux couleurs ; l'afficher dans une seule
       teinte constituerait une recoloration, que la charte Mastercard interdit sans
       accord partenaire. Le nom reste affiche en toutes lettres jusqu'a reception du
       fichier officiel bicolore aupres d'EXOCOMS ou du kit presse Mastercard. -->

