<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hors ligne — Sinistre Pro</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F5F7FA; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .wrap { text-align: center; padding: 40px 24px; max-width: 340px; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 22px; font-weight: 700; color: #1A1A2E; margin-bottom: 8px; }
        p { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 28px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: #0D47A1; color: white; border-radius: 10px; font-size: 14px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon">📡</div>
        <h1>Pas de connexion</h1>
        <p>Vous êtes hors ligne. Vos actions seront synchronisées automatiquement dès le retour du réseau.</p>
        <button class="btn" onclick="window.location.reload()">🔄 Réessayer</button>
    </div>
</body>
</html>
