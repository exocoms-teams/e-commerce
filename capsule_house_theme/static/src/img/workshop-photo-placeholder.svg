<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 600 340" preserveAspectRatio="xMidYMid meet" fill="none">
  <defs>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f0b49c"/>
      <stop offset="1" stop-color="#b85d44"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6cfbd" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f6cfbd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ead6"/>
      <stop offset="1" stop-color="#efd9bb"/>
    </linearGradient>
    <pattern id="boards" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="#ecdcc5"/>
      <rect x="0" y="0" width="1.6" height="10" fill="#dcc7aa"/>
    </pattern>
    <pattern id="shingles" width="16" height="9" patternUnits="userSpaceOnUse">
      <rect width="16" height="9" fill="#2b302c"/>
      <path d="M0 8.5 H16" stroke="#3d443f" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Fond crème, identique à la carte du site -->
  <rect x="0" y="0" width="600" height="400" fill="#faf5ef"/>

  <!-- Soleil -->
  <circle cx="488" cy="92" r="70" fill="url(#glow)"/>
  <circle cx="488" cy="92" r="36" fill="#f1c4b0"/>

  <!-- Nuages -->
  <g fill="#ffffff" opacity=".85">
    <path d="M70 92 a16 16 0 0 1 30 -8 a20 20 0 0 1 38 6 a13 13 0 0 1 -2 26 H80 a14 14 0 0 1 -10 -24z"/>
    <path d="M372 52 a12 12 0 0 1 22 -6 a15 15 0 0 1 28 4 a10 10 0 0 1 -1 20 H380 a11 11 0 0 1 -8 -18z"/>
  </g>

  <!-- Oiseaux -->
  <g stroke="#2b302c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 62 q7 -8 14 0 q7 -8 14 0"/>
    <path d="M232 80 q5 -6 10 0 q5 -6 10 0"/>
  </g>

  <!-- Sol : simple trait, comme sur la carte -->
  <path d="M30 321 H570" stroke="#2b302c" stroke-width="6" stroke-linecap="round"/>

  <!-- Arbre à droite -->
  <rect x="542" y="282" width="9" height="40" rx="3" fill="#6b5a48"/>
  <circle cx="546" cy="262" r="30" fill="#9db69f"/>
  <circle cx="566" cy="284" r="19" fill="#86a08a"/>
  <circle cx="530" cy="280" r="17" fill="#abc2ab"/>

  <!-- Cheminée + fumée -->
  <rect x="378" y="108" width="24" height="46" fill="#3d443f"/>
  <rect x="373" y="103" width="34" height="8" rx="2" fill="#2b302c"/>
  <g fill="#e6dccf" opacity=".95">
    <circle cx="392" cy="90" r="8"/>
    <circle cx="401" cy="72" r="11"/>
    <circle cx="414" cy="50" r="14"/>
  </g>

  <!-- Façade -->
  <polygon points="140,178 300,104 460,178 460,320 140,320" fill="url(#boards)"/>
  <polygon points="140,178 300,104 460,178 460,196 140,196" fill="#f1e4cf" opacity=".0"/>

  <!-- Toit -->
  <path d="M112 188 L300 98 L488 188" stroke="#2b302c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 188 L300 98 L488 188" stroke="url(#shingles)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 196 L300 112 L474 196" stroke="#c4694f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

  <!-- Girouette -->
  <path d="M300 96 V74" stroke="#2b302c" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 78 l18 6 l-18 6z" fill="#c4694f"/>
  <circle cx="300" cy="74" r="4" fill="#2b302c"/>

  <!-- Œil-de-bœuf -->
  <circle cx="300" cy="152" r="19" fill="#c4694f"/>
  <circle cx="300" cy="152" r="14" fill="#fbf4ea"/>
  <path d="M300 138 V166 M286 152 H314" stroke="#c4694f" stroke-width="2.5"/>

  <!-- Fenêtres latérales -->
  <g>
    <rect x="156" y="228" width="34" height="44" rx="3" fill="#fbf4ea" stroke="#c4694f" stroke-width="4"/>
    <path d="M173 228 V272 M156 250 H190" stroke="#c4694f" stroke-width="3"/>
    <rect x="150" y="270" width="46" height="6" rx="2" fill="#b3593f"/>
    <rect x="410" y="228" width="34" height="44" rx="3" fill="#fbf4ea" stroke="#c4694f" stroke-width="4"/>
    <path d="M427 228 V272 M410 250 H444" stroke="#c4694f" stroke-width="3"/>
    <rect x="404" y="270" width="46" height="6" rx="2" fill="#b3593f"/>
  </g>

