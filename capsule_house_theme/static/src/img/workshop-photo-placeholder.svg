  <rect x="205" y="217" width="190" height="103" fill="url(#inside)"/>
  <path d="M205 306 H395" stroke="#e3caa4" stroke-width="2"/>
  <g>
    <ellipse cx="300" cy="319" rx="42" ry="4" fill="#2b302c" opacity=".1"/>
    <rect x="268" y="281" width="64" height="37" rx="18.5" fill="#fbf7f1" stroke="#e6d3bd" stroke-width="3"/>
    <circle cx="285" cy="299.5" r="11" fill="url(#sphere)"/>
    <circle cx="320" cy="299.5" r="6" fill="#e3b9a6"/>
  </g>

  <!-- Portes coulissantes -->
  <g>
    <rect x="205" y="217" width="58" height="103" fill="#c4694f"/>
    <rect x="337" y="217" width="58" height="103" fill="#c4694f"/>
    <g stroke="#a8553d" stroke-width="4" stroke-linecap="round">
      <rect x="212" y="225" width="44" height="87" fill="none"/>
      <path d="M212 312 L256 225"/>
      <rect x="344" y="225" width="44" height="87" fill="none"/>
      <path d="M344 312 L388 225"/>
    </g>
    <rect x="260" y="262" width="5" height="22" rx="2.5" fill="#fbf4ea"/>
    <rect x="335" y="262" width="5" height="22" rx="2.5" fill="#fbf4ea"/>
  </g>
  <rect x="205" y="217" width="190" height="103" fill="none" stroke="#2b302c" stroke-width="6" stroke-linejoin="round"/>
  <rect x="198" y="208" width="204" height="10" rx="3" fill="#2b302c"/>

  <!-- Guirlande lumineuse -->
  <path d="M146 192 Q223 214 300 192 Q377 214 454 192" stroke="#6b5a48" stroke-width="1.6" fill="none"/>
  <g>
    <circle cx="184" cy="200" r="9" fill="#f7d9a8" opacity=".35"/>
    <circle cx="223" cy="203" r="9" fill="#f7d9a8" opacity=".35"/>
    <circle cx="261" cy="200" r="9" fill="#f7d9a8" opacity=".35"/>
    <circle cx="339" cy="200" r="9" fill="#f7d9a8" opacity=".35"/>
    <circle cx="377" cy="203" r="9" fill="#f7d9a8" opacity=".35"/>
    <circle cx="416" cy="200" r="9" fill="#f7d9a8" opacity=".35"/>
    <circle cx="184" cy="200" r="3.6" fill="#f4c27f"/>
    <circle cx="223" cy="203" r="3.6" fill="#f4c27f"/>
    <circle cx="261" cy="200" r="3.6" fill="#f4c27f"/>
    <circle cx="339" cy="200" r="3.6" fill="#f4c27f"/>
    <circle cx="377" cy="203" r="3.6" fill="#f4c27f"/>
    <circle cx="416" cy="200" r="3.6" fill="#f4c27f"/>
  </g>

  <!-- Pile de planches -->
  <g>
    <rect x="474" y="306" width="62" height="9" rx="2" fill="#c9a47a"/>
    <rect x="478" y="297" width="56" height="9" rx="2" fill="#e0c29a"/>
    <rect x="474" y="288" width="60" height="9" rx="2" fill="#d6b48a"/>
    <rect x="470" y="315" width="70" height="5" rx="2" fill="#8c6f52"/>
  </g>

  <!-- Pod terminé à gauche, sur palette -->
  <g>
    <ellipse cx="68" cy="324" rx="48" ry="4.5" fill="#2b302c" opacity=".1"/>
    <rect x="22" y="312" width="92" height="8" rx="2" fill="#b58d63"/>
    <path d="M32 312 v8 M68 312 v8 M104 312 v8" stroke="#8c6f52" stroke-width="3"/>
    <rect x="26" y="272" width="84" height="40" rx="20" fill="#fbf7f1" stroke="#e6d3bd" stroke-width="3"/>
    <circle cx="47" cy="292" r="12" fill="url(#sphere)"/>
    <circle cx="90" cy="292" r="6.5" fill="#e3b9a6"/>
  </g>

  <!-- Buissons et fleurs -->
  <g>
    <circle cx="150" cy="316" r="11" fill="#9db69f"/>
    <circle cx="166" cy="319" r="8" fill="#86a08a"/>
    <circle cx="448" cy="316" r="11" fill="#9db69f"/>
    <circle cx="432" cy="319" r="8" fill="#86a08a"/>
    <circle cx="154" cy="312" r="2.6" fill="#c4694f"/>
    <circle cx="146" cy="318" r="2.6" fill="#e3a285"/>
    <circle cx="452" cy="312" r="2.6" fill="#c4694f"/>
    <circle cx="444" cy="318" r="2.6" fill="#e3a285"/>
  </g>

  <!-- Tiges d'herbe -->
  <g stroke="#86a08a" stroke-width="2.4" stroke-linecap="round">
    <path d="M186 321 v-9 M190 321 v-12 M194 321 v-8"/>
    <path d="M408 321 v-8 M412 321 v-12 M416 321 v-9"/>
  </g>
</svg>
