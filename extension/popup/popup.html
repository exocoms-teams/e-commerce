<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrap">
    <header class="header">
      <div class="header-logo">
        <span class="logo-dot"></span>
        <span class="logo-text"></span>
      </div>
      <button id="optionsBtn" class="icon-btn" title="Open Full Dashboard">&#9881;</button>
    </header>

    <div class="stats-row">
      <div class="stat-pill">
        <span class="stat-num" id="statProducts">0</span>
        <span class="stat-lbl">Products</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num" id="statViews">0</span>
        <span class="stat-lbl">Views</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num" id="statPurchases">0</span>
        <span class="stat-lbl">Purchases</span>
      </div>
    </div>

    <div class="section-label">Trending Now</div>
    <div id="trendingList" class="trending-list">
      <p class="empty">Loading...</p>
    </div>

    <div class="section-label">Log Product Manually</div>
    <div class="manual-form">
      <input id="manualTitle" type="text" placeholder="Product name" class="input">
      <div class="form-row">
        <input id="manualPrice" type="number" placeholder="Price $" class="input half" step="0.01">
        <input id="manualCategory" type="text" placeholder="Category" class="input half">
      </div>
      <button id="manualSave" class="btn-save">Log Purchase</button>
    </div>

    <footer class="footer">
      <button id="openDashboard" class="btn-dashboard">Open Full Dashboard</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
