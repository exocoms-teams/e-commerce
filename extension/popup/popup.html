<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
                <h1>Purchase Tracker</h1>
                <button id="settingsBtn" class="settings-btn" title="Settings">Settings</button>
        <div class="stats-section">
            <h2>Today's Activity</h2>
            <div class="stat-item">
                <span class="label">Items Tracked:</span>
                <span class="value" id="itemsCount">0</span>
            </div>
            <div class="stat-item">
                <span class="label">Total Spent:</span>
                <span class="value" id="totalSpent">$0.00</span>
            </div>
            <div class="stat-item">
                <span class="label">Average Price:</span>
                <span class="value" id="avgPrice">$0.00</span>
            </div>
        </div>

        <div class="category-section">
            <h2>Categories</h2>
            <div id="categoriesList" class="categories-list">
                <p class="empty-message">No data yet</p>
            </div>
        </div>

        <div class="actions">
            <button id="viewHistoryBtn" class="btn btn-primary">View History</button>
            <button id="clearDataBtn" class="btn btn-secondary">Clear Data</button>
        </div>

        <footer>
            <small>Last updated: <span id="lastUpdated">--:--</span></small>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
