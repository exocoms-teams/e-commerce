<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review your formulas and complete your premium checkout journey safely with LUMIÈRE.">
  <title>Your Shopping Bag | LUMIÈRE Cosmetics</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Full Split Dedicated View Screen Calculations */
    .cart-page-layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 5rem;
      margin-top: 4rem;
    }
    .main-cart-table-pane {
      background-color: var(--white);
      border: 1px solid var(--border-color);
      padding: 4rem;
    }
    .order-summary-panel {
      background-color: var(--white);
      border: 1px solid var(--border-color);
      padding: 4rem;
      height: fit-content;
    }
    .order-summary-panel h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 400;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    
    .table-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }
    .table-item-row:first-child { padding-top: 0; }
    .table-item-row:last-child { border-bottom: none; padding-bottom: 0; }

    .summary-calc-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.5rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .summary-calc-row.grand-total {
      border-top: 1px solid var(--border-color);
      padding-top: 2rem;
      margin-top: 2rem;
      font-size: 1.8rem;
      color: var(--text-color);
      font-weight: 600;
    }

    .promo-input-dock {
      display: flex;
      gap: 1rem;
      margin: 3rem 0;
    }
    .promo-input-dock input {
      flex-grow: 1;
      border: 1px solid var(--border-color);
      padding: 1.2rem 1.5rem;
      font-family: 'Jost', sans-serif;
      font-size: 1.4rem;
      outline: none;
    }

    .standalone-empty-display {
      text-align: center;
      padding: 12rem 4rem;
      background-color: var(--white);
      border: 1px solid var(--border-color);
    }
    .standalone-empty-display i { font-size: 5rem; color: var(--border-color); margin-bottom: 2rem; }
    .standalone-empty-display h3 { font-family: 'Cormorant Garamond', serif; font-size: 3rem; margin-bottom: 1.5rem; }

    @media(max-width: 991px) {
      .cart-page-layout { grid-template-columns: 1fr; }
      .main-cart-table-pane, .order-summary-panel { padding: 3rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">LUMIÈRE<span>.</span></a>
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="cart-btn" id="cart-btn" style="pointer-events:none;">
        <i class="fa-regular fa-bag-shopping"></i>
        <span class="cart-count">0</span>
      </button>
      <a href="shop.html" class="btn-primary">Explore Collection</a>
    </div>
  </header>

  <section class="cart-page-section">
    <div class="section-header" style="margin-bottom:2rem;">
      <h2>Your Detailed Bag Portfolio</h2>
      <p>Review your selection before initializing secure transaction procedures.</p>
    </div>

    <div id="dedicated-cart-wrapper">
       </div>
  </section>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    // Component Module Processing Full Screen Separate Page Cart Updates
    document.addEventListener("DOMContentLoaded", () => {
      const pageWrapper = document.getElementById("dedicated-cart-wrapper");

      function syncAndRenderDedicatedCartPage() {
        const cart = getCartData();

        if (cart.length === 0) {
          pageWrapper.innerHTML = `
            <div class="standalone-empty-display">
              <i class="fa-regular fa-bag-shopping"></i>
              <h3>Your bag is presently unallocated</h3>
              <p style="color:var(--text-muted); margin-bottom:3rem;">We invite you to discover our premium skin assets and baseline catalog metrics.</p>
              <button class="btn-primary" onclick="window.location.href='shop.html'">Browse Formulations</button>
            </div>
          `;
          return;
        }

        const subtotalSum = cart.reduce((acc, curr) => acc + (curr.price * curr.quantity), 0);

        let listMarkup = cart.map(item => {
          const shadeCallout = item.shade ? `<div class="cart-item-shade" style="margin-top:0.5rem;"><span class="shade-dot" style="background-color: ${getShadeHex(item.id, item.shade)}"></span>${item.shade}</div>` : "";
          return `
            <div class="table-item-row">
              <div style="display:flex; gap:2.5rem; align-items:center;">
                <div class="cart-item-img" style="width:10rem; height:12rem; background-color:var(--second-bg-color);">
                  <img src="${item.img}" alt="${item.name}" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div>
                  <span class="cat" style="font-size:1.1rem; text-transform:uppercase; color:var(--main-color); letter-spacing:0.1em;">${item.category}</span>
                  <h4 style="font-family:'Cormorant Garamond', serif; font-size:2.2rem; font-weight:400; margin:0.4rem 0;">${item.name}</h4>
                  ${shadeCallout}
                  <div style="font-size:1.5rem; font-weight:500; margin-top:0.8rem;">$${item.price}</div>
                </div>
              </div>

              <div style="display:flex; align-items:center; gap:4rem;">
                <div class="cart-item-qty-ctrl">
                  <button onclick="changeItemQuantity('${item.compositeKey}', -1)">−</button>
                  <span>${item.quantity}</span>
                  <button onclick="changeItemQuantity('${item.compositeKey}', 1)">+</button>
                </div>
                <div style="font-size:1.6rem; font-weight:600; width:8rem; text-align:right;">
                  $${(item.price * item.quantity).toFixed(2)}
                </div>
                <button onclick="deleteItemFromCart('${item.compositeKey}')" style="background:none; border:none; cursor:pointer; font-size:1.8rem; color:var(--text-muted); margin-left:1rem;">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
          `;
        }).join("");

        pageWrapper.innerHTML = `
          <div class="cart-page-layout">
            <div class="main-cart-table-pane">
              ${listMarkup}
            </div>

            <div class="order-summary-panel">
              <h3>Order Validation Metrics</h3>
              <div class="summary-calc-row">
                <span>Items Subtotal</span>
                <span>$${subtotalSum.toFixed(2)}</span>
              </div>
              <div class="summary-calc-row">
                <span>Dermatological Secure Shipping</span>
                <span style="color:var(--main-color)">Complimentary</span>
              </div>
              
              <div class="promo-input-dock">
                <input type="text" id="coupon-field" placeholder="Enter Promotional Token">
                <button class="btn-primary" id="apply-coupon-btn" style="padding:0 2rem;">Apply</button>
              </div>

              <div class="summary-calc-row grand-total">
                <span>Aggregate Total</span>
                <span>$${subtotalSum.toFixed(2)}</span>
              </div>

              <button class="btn-primary" id="execute-checkout-btn" style="width:100%; padding:1.8rem 0; margin-top:2rem;">
                Initialize Transaction Routing
              </button>
            </div>
          </div>
        `;

        // Attach transaction simulators cleanly
        document.getElementById("execute-checkout-btn").addEventListener("click", () => {
          alert("LUMIÈRE Logistical Simulator: Secure payment routing pipeline initialized cleanly.");
          localStorage.removeItem("lumiere_cart_items");
          window.location.href = "index.html";
        });

        document.getElementById("apply-coupon-btn").addEventListener("click", () => {
          const field = document.getElementById("coupon-field");
          if (field && field.value.trim() !== "") {
            triggerToastNotification("Token verified. Adjusting algorithmic values.");
            field.value = "";
          }
        });
      }

      // Re-trigger page updates whenever shared localstorage operations alter structural values
      window.addEventListener("cartUpdated", syncAndRenderDedicatedCartPage);
      
      // Perform initial layout parse pass cleanly
      syncAndRenderDedicatedCartPage();
    });
  </script>
</body>
</html>
